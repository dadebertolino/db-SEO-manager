name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

  phpcs:
    name: PHPCS (WordPress Coding Standards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - name: Install PHPCS + WPCS
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require wp-coding-standards/wpcs:^3.0 dealerdirect/phpcodesniffer-composer-installer
      - name: Run PHPCS
        run: |
          ~/.composer/vendor/bin/phpcs -p --standard=WordPress-Extra \
            --extensions=php \
            --ignore=vendor \
            --warning-severity=0 \
            . || true   # Report-only per ora: si promuove a bloccante quando il baseline è pulito
